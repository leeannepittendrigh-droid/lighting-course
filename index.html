<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Commercial Lighting Essentials</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>">

  <!-- Docsify base theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
       ============================================================ */
    :root {
      --navy:         #0D1B3E;
      --navy-mid:     #162554;
      --navy-light:   #1E3272;
      --orange:       #F47B20;
      --orange-soft:  #FEF0E4;
      --orange-dark:  #D4620A;
      --bg:           #F0F3F9;
      --bg-content:   #FFFFFF;
      --border:       #DDE2EE;
      --border-light: #EEF1F8;
      --text:         #1A2035;
      --text-muted:   #5A6480;
      --font-ui:      'Plus Jakarta Sans', sans-serif;
      --font-body:    'Plus Jakarta Sans', sans-serif;
      --radius:       8px;
      --radius-lg:    12px;
      --shadow:       0 2px 20px rgba(13,27,62,0.09);
    }

    /* ============================================================
       BASE
       ============================================================ */
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: var(--font-body) !important;
      background: var(--bg) !important;
      color: var(--text) !important;
    }

    /* ============================================================
       NAVBAR
       ============================================================ */
    .app-nav {
      background: var(--navy) !important;
      padding: 0 40px !important;
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      height: 56px !important;
      display: flex !important;
      align-items: center !important;
      justify-content: space-between !important;
      z-index: 100 !important;
      box-shadow: 0 2px 12px rgba(0,0,0,0.2) !important;
      margin: 0 !important;
    }

    /* Course title on left of navbar */
    .app-nav::before {
      content: '💡 Commercial Lighting Essentials';
      font-family: var(--font-ui);
      font-weight: 800;
      font-size: 0.9rem;
      color: #FFFFFF;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }

    .app-nav ul {
      display: flex !important;
      align-items: center !important;
      gap: 4px !important;
      list-style: none !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .app-nav li {
      margin: 0 !important;
      padding: 0 !important;
      position: relative !important;
    }

    .app-nav a {
      font-family: var(--font-body) !important;
      font-size: 0.82rem !important;
      font-weight: 500 !important;
      color: rgba(255,255,255,0.72) !important;
      padding: 6px 14px !important;
      border-radius: var(--radius) !important;
      text-decoration: none !important;
      transition: all 0.15s !important;
      white-space: nowrap !important;
    }

    .app-nav a:hover {
      color: #FFFFFF !important;
      background: rgba(255,255,255,0.1) !important;
    }

    /* Active nav item */
    .app-nav li.active > a,
    .app-nav a.active {
      color: #FFFFFF !important;
      background: rgba(244,123,32,0.25) !important;
      border: 1px solid rgba(244,123,32,0.4) !important;
    }

    /* ============================================================
       MAIN CONTENT LAYOUT
       — no sidebar nav tree, full width. The docsify search plugin
       (loaded below) mounts its search box into .sidebar by design —
       instead of hiding it outright, we repurpose .sidebar into a
       slim site-search bar under the navbar and hide only the nav
       tree portion of it.
       ============================================================ */
    .sidebar-toggle { display: none !important; }

    .sidebar {
      display: flex !important;
      align-items: center !important;
      position: fixed !important;
      top: 56px !important;
      left: 0 !important;
      right: 0 !important;
      width: auto !important;
      height: 46px !important;
      background: var(--bg-content) !important;
      border-bottom: 1px solid var(--border) !important;
      padding: 0 40px !important;
      z-index: 99 !important;
      overflow: visible !important;
    }

    /* Hide everything docsify puts in .sidebar except the search box
       (app name, and the nav-tree <aside>, which is empty anyway
       since loadSidebar is false) */
    .sidebar > *:not(.search) { display: none !important; }

    .sidebar .search {
      width: 100% !important;
      max-width: 420px !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    .sidebar .search .input-wrap { display: flex !important; align-items: center !important; }

    .sidebar .search input.search-input {
      width: 100% !important;
      font-family: var(--font-body) !important;
      font-size: 0.85rem !important;
      padding: 8px 14px !important;
      border: 1px solid var(--border) !important;
      border-radius: 20px !important;
      background: var(--bg) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
      margin: 0 !important;
    }

    .sidebar .search input.search-input:focus {
      outline: none !important;
      border-color: var(--orange) !important;
      background: var(--bg-content) !important;
      box-shadow: 0 0 0 3px var(--orange-soft) !important;
    }

    .sidebar .search .clear-button {
      right: 14px !important;
    }

    .sidebar .search .results-panel {
      display: none;
      position: absolute !important;
      top: 44px !important;
      left: 40px !important;
      width: 100% !important;
      max-width: 420px !important;
      max-height: 60vh !important;
      overflow-y: auto !important;
      background: var(--bg-content) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow) !important;
      border: 1px solid var(--border) !important;
      padding: 8px !important;
      z-index: 101 !important;
    }

    .sidebar .search .results-panel.show { display: block !important; }

    .sidebar .search .matching-post {
      display: block !important;
      padding: 10px 12px !important;
      border-radius: var(--radius) !important;
      border: none !important;
      margin-bottom: 4px !important;
    }

    .sidebar .search .matching-post:hover { background: var(--orange-soft) !important; }

    .sidebar .search .matching-post p {
      font-size: 0.7rem !important;
      color: var(--text-muted) !important;
      margin: 4px 0 0 !important;
    }

    .sidebar .search .search-keyword {
      color: var(--orange-dark) !important;
      font-style: normal !important;
      font-weight: 700 !important;
    }

    .sidebar .search .empty {
      padding: 12px !important;
      color: var(--text-muted) !important;
      font-size: 0.82rem !important;
    }

    @media (max-width: 768px) {
      .sidebar { padding: 0 20px !important; height: 42px !important; }
      .sidebar .search .results-panel { left: 20px !important; }
    }

    .content {
      left: 0 !important;
      padding-top: 102px !important;
      background: var(--bg) !important;
    }

    .markdown-section {
      max-width: 960px !important;
      margin: 40px auto !important;
      padding: 56px 72px 80px !important;
      background: var(--bg-content) !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: var(--shadow) !important;
    }

    /* Top gradient stripe */
    .markdown-section::before {
      content: '';
      display: block;
      height: 4px;
      background: linear-gradient(90deg, var(--navy), var(--orange));
      border-radius: var(--radius) var(--radius) 0 0;
      margin: -56px -72px 48px -72px;
    }

    @media (max-width: 1100px) {
      .markdown-section { padding: 48px 48px 64px !important; }
      .markdown-section::before { margin: -48px -48px 40px -48px; }
    }

    @media (max-width: 768px) {
      .app-nav { padding: 0 20px !important; }
      .app-nav::before { font-size: 0.78rem; }
      .app-nav a { font-size: 0.75rem !important; padding: 5px 10px !important; }
      .markdown-section { margin: 16px !important; padding: 32px 24px 48px !important; }
      .markdown-section::before { margin: -32px -24px 32px -24px; }
    }

    /* ============================================================
       HOME PAGE — MODULE CARDS
       ============================================================ */
    .course-intro {
      font-size: 1.05rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 40px;
      max-width: 600px;
    }

    .module-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 24px;
      margin: 0 0 48px 0;
    }

    @media (max-width: 900px) {
      .module-cards { grid-template-columns: 1fr; }
    }

    .module-card {
      background: var(--bg-content);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s, transform 0.2s, border-color 0.2s;
      box-shadow: 0 1px 4px rgba(13,27,62,0.06);
      cursor: pointer;
    }

    .module-card:hover {
      box-shadow: 0 8px 32px rgba(13,27,62,0.14);
      transform: translateY(-3px);
      border-color: var(--navy);
    }

    .module-card:hover .module-card-btn {
      background: var(--navy-light) !important;
    }

    .module-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .module-number {
      font-family: var(--font-ui);
      font-size: 2rem;
      font-weight: 800;
      color: var(--border);
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .module-duration {
      font-family: var(--font-body);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .module-card h3 {
      font-family: var(--font-ui) !important;
      font-size: 1.05rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      margin: 0 0 10px 0 !important;
      padding: 0 !important;
      border: none !important;
    }

    .module-card p {
      font-size: 0.875rem !important;
      color: var(--text-muted) !important;
      line-height: 1.6 !important;
      margin-bottom: 16px !important;
      flex-grow: 1;
    }

    .module-card ul {
      list-style: none !important;
      padding: 0 !important;
      margin: 0 0 24px 0 !important;
    }

    .module-card ul li {
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      padding: 3px 0 !important;
      margin: 0 !important;
      padding-left: 16px !important;
      position: relative;
    }

    .module-card ul li::before {
      content: '→';
      position: absolute;
      left: 0;
      color: var(--orange);
      font-size: 0.75rem;
    }

    .module-card-btn {
      display: block;
      background: var(--navy) !important;
      color: #FFFFFF !important;
      text-align: center;
      padding: 10px 16px;
      border-radius: var(--radius);
      font-family: var(--font-ui) !important;
      font-weight: 700 !important;
      font-size: 0.82rem !important;
      text-decoration: none !important;
      border: none !important;
      border-bottom: none !important;
      transition: background 0.15s;
      margin-top: auto;
    }

    /* Docsify base theme overrides — re-assert button text color */
    .markdown-section .module-card-btn,
    .markdown-section .module-card .module-card-btn,
    section.cover .module-card-btn {
      color: #FFFFFF !important;
      border-bottom: none !important;
    }

    .module-card-btn:hover,
    .markdown-section .module-card-btn:hover {
      background: var(--navy-light) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-bottom: none !important;
    }

    /* Course meta bar */
    .course-meta {
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      background: var(--navy);
      border-radius: var(--radius);
      padding: 16px 24px;
      margin-top: 8px;
    }

    .course-meta-item {
      font-size: 0.82rem;
      color: rgba(255,255,255,0.72);
      font-family: var(--font-body);
    }

    /* Qualified with .markdown-section so these reliably beat the
       generic .markdown-section strong/a rules below (same
       specificity + !important on both sides means source order
       would otherwise decide, which made this text invisible —
       navy-on-navy — against the dark course-meta background). */
    .markdown-section .course-meta-item strong {
      color: #FFFFFF !important;
    }

    .markdown-section .course-meta-item a {
      color: #FFFFFF !important;
      font-weight: 600 !important;
      border-bottom: 1.5px solid rgba(255,255,255,0.4) !important;
    }

    .markdown-section .course-meta-item a:hover {
      color: var(--orange) !important;
      border-bottom-color: var(--orange) !important;
    }

    /* ============================================================
       PAGE TYPOGRAPHY
       ============================================================ */
    .markdown-section h1 {
      font-family: var(--font-ui) !important;
      font-size: 2rem !important;
      font-weight: 800 !important;
      color: var(--navy) !important;
      letter-spacing: -0.03em !important;
      line-height: 1.2 !important;
      margin-bottom: 12px !important;
      border-bottom: none !important;
      padding-bottom: 0 !important;
    }

    /* Module meta bar (> after h1) */
    .markdown-section h1 + blockquote {
      background: var(--navy) !important;
      border-left: none !important;
      border-radius: var(--radius) !important;
      padding: 12px 20px !important;
      margin: 14px 0 44px !important;
    }

    .markdown-section h1 + blockquote p {
      color: rgba(255,255,255,0.72) !important;
      font-size: 0.82rem !important;
      margin: 0 !important;
    }

    .markdown-section h1 + blockquote strong {
      color: #FFFFFF !important;
    }

    /* H2 — lesson section dividers */
    .markdown-section h2 {
      font-family: var(--font-ui) !important;
      font-size: 1.25rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      border-bottom: none !important;
      border-left: 4px solid var(--navy) !important;
      background: var(--bg) !important;
      padding: 14px 18px !important;
      margin: 56px 0 20px !important;
      border-radius: 0 var(--radius) var(--radius) 0 !important;
    }

    /* H3 */
    .markdown-section h3 {
      font-family: var(--font-ui) !important;
      font-size: 1.05rem !important;
      font-weight: 700 !important;
      color: #0D1B3E !important;
      margin: 36px 0 12px !important;
      padding-bottom: 9px !important;
      border-bottom: 2px solid var(--border) !important;
    }

    /* H4 */
    .markdown-section h4 {
      font-family: var(--font-ui) !important;
      font-size: 0.8rem !important;
      font-weight: 700 !important;
      color: #2A3F6F !important;
      text-transform: uppercase !important;
      letter-spacing: 0.07em !important;
      margin: 24px 0 8px !important;
      padding-left: 10px !important;
      border-left: 3px solid var(--orange) !important;
    }

    .markdown-section p {
      font-size: 0.945rem !important;
      line-height: 1.78 !important;
      color: var(--text) !important;
      margin-bottom: 14px !important;
    }

    .markdown-section a {
      color: var(--navy) !important;
      font-weight: 500 !important;
      border-bottom: 1.5px solid var(--border) !important;
      text-decoration: none !important;
      transition: color 0.15s, border-color 0.15s !important;
    }

    .markdown-section a:hover {
      color: var(--orange) !important;
      border-bottom-color: var(--orange) !important;
    }

    /* Override card links */
    .module-card a,
    .module-card-btn {
      border-bottom: none !important;
    }

    .markdown-section strong {
      font-weight: 600 !important;
      color: var(--navy) !important;
    }

    .markdown-section hr {
      border: none !important;
      border-top: 1px solid var(--border-light) !important;
      margin: 40px 0 !important;
    }

    /* ============================================================
       BLOCKQUOTES
       ============================================================ */
    .markdown-section blockquote {
      border-left: 4px solid var(--orange) !important;
      background: var(--orange-soft) !important;
      padding: 13px 18px !important;
      border-radius: 0 var(--radius) var(--radius) 0 !important;
      margin: 20px 0 !important;
    }

    .markdown-section blockquote p {
      font-size: 0.875rem !important;
      line-height: 1.6 !important;
      margin: 0 !important;
      color: var(--text) !important;
    }

    /* ============================================================
       TABLES
       ============================================================ */

    /* Docsify wraps tables in a div — override it */
    .markdown-section > div[style*="overflow"] {
      width: 100% !important;
      max-width: 100% !important;
    }

    .markdown-section table {
      display: table !important; /* Docsify's theme sets display:block for mobile scroll —
                                     that breaks the table layout algorithm so the header/rows
                                     never stretch to fill the 100% width below. Reset it. */
      width: 100% !important;
      border-collapse: collapse !important;
      margin: 20px 0 !important;
      font-size: 0.865rem !important;
      border-radius: var(--radius-lg) !important;
      overflow: hidden !important;
      box-shadow: 0 0 0 1px var(--border) !important;
    }

    .markdown-section thead tr {
      background: var(--navy) !important;
      border-bottom: none !important;
    }

    .markdown-section thead th {
      color: rgba(255,255,255,0.88) !important;
      font-family: var(--font-ui) !important;
      font-size: 0.7rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      padding: 11px 16px !important;
      text-align: left !important;
      background: transparent !important;
      border: none !important;
    }

    .markdown-section tbody tr {
      border-bottom: 1px solid var(--border-light) !important;
      transition: background 0.1s !important;
    }

    .markdown-section tbody tr:nth-child(even) { background: var(--bg) !important; }
    .markdown-section tbody tr:hover { background: var(--orange-soft) !important; }
    .markdown-section tbody tr:last-child { border-bottom: none !important; }

    .markdown-section td {
      padding: 10px 16px !important;
      vertical-align: top !important;
      line-height: 1.5 !important;
      border: none !important;
    }

    .markdown-section td:first-child {
      font-weight: 500 !important;
      color: var(--navy) !important;
    }

    /* ============================================================
       TABLE INTERACTIVITY — sortable columns + searchable glossary
       (added by clc-table-enhance.js, see bottom of page)
       ============================================================ */
    .markdown-section table.clc-sortable thead th {
      cursor: pointer !important;
      user-select: none !important;
      white-space: nowrap !important;
    }
    .markdown-section table.clc-sortable thead th:hover {
      background: rgba(255,255,255,0.1) !important;
    }
    .markdown-section table.clc-sortable thead th .clc-caret {
      display: inline-block;
      margin-left: 5px;
      font-size: 0.7em;
      opacity: 0.35;
    }
    .markdown-section table.clc-sortable thead th.clc-sorted .clc-caret {
      opacity: 1;
      color: var(--orange) !important;
    }

    .clc-glossary-wrap { margin: 20px 0 !important; }
    .clc-glossary-search {
      width: 100% !important;
      font-family: var(--font-ui) !important;
      font-size: 0.88rem !important;
      padding: 9px 13px !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      background: var(--bg-content) !important;
      color: var(--text) !important;
      margin-bottom: 10px !important;
      box-sizing: border-box !important;
    }
    .clc-glossary-search:focus {
      outline: none !important;
      border-color: var(--orange) !important;
      box-shadow: 0 0 0 3px var(--orange-soft) !important;
    }
    .clc-glossary-scroll {
      max-height: 320px !important;
      overflow-y: auto !important;
      border-radius: var(--radius-lg) !important;
      box-shadow: 0 0 0 1px var(--border) !important;
    }
    .clc-glossary-scroll table { margin: 0 !important; box-shadow: none !important; }
    .clc-glossary-scroll thead th { position: sticky !important; top: 0 !important; z-index: 1 !important; }
    .clc-glossary-empty {
      padding: 16px !important;
      text-align: center !important;
      color: var(--text-muted) !important;
      font-size: 0.85rem !important;
    }
    tr.clc-hidden { display: none !important; }

    /* ============================================================
       GOING DEEPER — collapsible <details> sections for optional
       math-heavy / advanced content
       ============================================================ */
    .markdown-section details {
      background: var(--bg) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      margin: 18px 0 !important;
      padding: 4px 18px !important;
    }

    .markdown-section details[open] { padding-bottom: 14px !important; }

    .markdown-section details summary {
      cursor: pointer !important;
      font-family: var(--font-ui) !important;
      font-weight: 700 !important;
      font-size: 0.88rem !important;
      color: var(--navy) !important;
      padding: 12px 0 !important;
      list-style: none !important;
      display: flex !important;
      align-items: center !important;
      gap: 8px !important;
    }

    .markdown-section details summary::-webkit-details-marker { display: none !important; }

    .markdown-section details summary::before {
      content: '▸';
      color: var(--orange) !important;
      transition: transform 0.15s !important;
      display: inline-block !important;
    }

    .markdown-section details[open] summary::before { transform: rotate(90deg) !important; }

    .markdown-section details summary:hover { color: var(--orange-dark) !important; }

    .markdown-section details > *:not(summary):first-of-type { margin-top: 4px !important; }
    .markdown-section details p:last-child,
    .markdown-section details table:last-child { margin-bottom: 4px !important; }

    /* ============================================================
       COLLAPSIBLE LESSONS
       Each "## Lesson N" heading is followed by a
       <details class="clc-lesson-details"> wrapping the lesson body,
       so long modules collapse to a scannable list of headings. The
       existing "Lessons in This Module" overview table (linking to
       each #lesson-N anchor) is the one place to jump around within
       a module — deliberately not duplicated elsewhere.
       ============================================================ */

    /* Top-level lesson accordion (distinct from the smaller nested
       "Going Deeper" details inside it) */
    .markdown-section details.clc-lesson-details {
      border-color: var(--navy-light) !important;
      padding: 4px 20px !important;
      margin: 10px 0 32px !important;
    }

    .markdown-section details.clc-lesson-details > summary.clc-lesson-summary {
      font-size: 0.75rem !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      color: var(--text-muted) !important;
    }

    .markdown-section details.clc-lesson-details > summary.clc-lesson-summary:hover {
      color: var(--orange-dark) !important;
    }

    /* Nested "Going Deeper" details inside a lesson accordion read as
       secondary content */
    .markdown-section details.clc-lesson-details details {
      margin-left: 2px !important;
    }

    /* ============================================================
       MODULE QUIZ WIDGET
       (rendered by assets/quiz.js into <div class="clc-quiz">)
       ============================================================ */
    .clc-quiz-wrap {
      margin: 20px 0 !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      padding: 24px 28px !important;
      background: var(--bg) !important;
    }

    .clc-quiz-title {
      font-family: var(--font-ui) !important;
      font-size: 1rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      margin: 0 0 4px !important;
    }

    .clc-quiz-sub {
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      margin: 0 0 18px !important;
    }

    .clc-quiz-badge {
      color: #1E7A3D !important;
      font-weight: 700 !important;
    }

    .clc-quiz-name-label {
      display: block !important;
      font-family: var(--font-ui) !important;
      font-size: 0.78rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      margin-bottom: 20px !important;
    }

    .clc-quiz-name-input {
      display: block !important;
      width: 100% !important;
      max-width: 320px !important;
      margin-top: 6px !important;
      font-family: var(--font-body) !important;
      font-size: 0.9rem !important;
      padding: 9px 13px !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      background: var(--bg-content) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
      text-transform: none !important;
      letter-spacing: normal !important;
      font-weight: 400 !important;
    }

    .clc-quiz-name-input:focus,
    .clc-quiz-name-input.clc-quiz-error {
      outline: none !important;
      border-color: var(--orange) !important;
    }

    .clc-quiz-question {
      background: var(--bg-content) !important;
      border: 1px solid var(--border-light) !important;
      border-radius: var(--radius) !important;
      padding: 16px 18px !important;
      margin-bottom: 12px !important;
    }

    .clc-quiz-question.clc-quiz-error {
      border-color: var(--orange) !important;
      box-shadow: 0 0 0 2px var(--orange-soft) !important;
    }

    .clc-quiz-q-text {
      font-size: 0.9rem !important;
      font-weight: 600 !important;
      color: var(--text) !important;
      margin: 0 0 10px !important;
      line-height: 1.5 !important;
    }

    .clc-quiz-choices { display: flex !important; flex-direction: column !important; gap: 6px !important; }

    .clc-quiz-choice {
      display: flex !important;
      align-items: baseline !important;
      gap: 8px !important;
      font-size: 0.86rem !important;
      color: var(--text) !important;
      cursor: pointer !important;
      padding: 4px 2px !important;
    }

    .clc-quiz-choice input { margin: 0 !important; cursor: pointer !important; }

    .clc-quiz-submit,
    .clc-quiz-retake {
      font-family: var(--font-ui) !important;
      font-weight: 700 !important;
      font-size: 0.85rem !important;
      background: var(--navy) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: var(--radius) !important;
      padding: 11px 24px !important;
      cursor: pointer !important;
      margin-top: 8px !important;
    }

    .clc-quiz-submit:hover,
    .clc-quiz-retake:hover { background: var(--navy-light) !important; }

    .clc-quiz-submit:disabled { opacity: 0.6 !important; cursor: default !important; }

    .clc-quiz-retake { margin-top: 12px !important; background: var(--orange) !important; }
    .clc-quiz-retake:hover { background: var(--orange-dark) !important; }

    .clc-quiz-result {
      margin-top: 16px !important;
      padding: 16px 18px !important;
      border-radius: var(--radius) !important;
      font-size: 0.9rem !important;
    }

    .clc-quiz-result-pass { background: #E8F6ED !important; color: #1E7A3D !important; border: 1px solid #BEE6CB !important; }
    .clc-quiz-result-fail { background: #FDF2F2 !important; color: #C0392B !important; border: 1px solid #F5C6C6 !important; }
    .clc-quiz-result-warn { background: var(--orange-soft) !important; color: var(--orange-dark) !important; border: 1px solid #F9D9B8 !important; }

    /* ============================================================
       PAGE FEEDBACK WIDGET
       (auto-appended to the end of every page by assets/feedback.js)
       ============================================================ */
    .clc-feedback-wrap {
      margin: 32px 0 12px !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-lg) !important;
      padding: 20px 24px !important;
      background: var(--bg) !important;
    }

    .clc-feedback-title {
      font-family: var(--font-ui) !important;
      font-size: 0.95rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      margin: 0 0 3px !important;
    }

    .clc-feedback-sub {
      font-size: 0.8rem !important;
      color: var(--text-muted) !important;
      margin: 0 0 16px !important;
    }

    .clc-feedback-row {
      display: flex !important;
      gap: 12px !important;
      flex-wrap: wrap !important;
      margin-bottom: 12px !important;
    }

    .clc-feedback-field { flex: 1 1 200px !important; min-width: 160px !important; }

    .clc-feedback-label {
      display: block !important;
      font-family: var(--font-ui) !important;
      font-size: 0.72rem !important;
      font-weight: 700 !important;
      color: var(--navy) !important;
      text-transform: uppercase !important;
      letter-spacing: 0.06em !important;
      margin-bottom: 6px !important;
    }

    .clc-feedback-select,
    .clc-feedback-name-input,
    .clc-feedback-textarea {
      display: block !important;
      width: 100% !important;
      font-family: var(--font-body) !important;
      font-size: 0.88rem !important;
      padding: 9px 13px !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius) !important;
      background: var(--bg-content) !important;
      color: var(--text) !important;
      box-sizing: border-box !important;
      font-weight: 400 !important;
    }

    .clc-feedback-textarea { resize: vertical !important; min-height: 72px !important; font-family: var(--font-body) !important; }

    .clc-feedback-select:focus,
    .clc-feedback-name-input:focus,
    .clc-feedback-textarea:focus,
    .clc-feedback-textarea.clc-feedback-error {
      outline: none !important;
      border-color: var(--orange) !important;
    }

    .clc-feedback-submit {
      font-family: var(--font-ui) !important;
      font-weight: 700 !important;
      font-size: 0.85rem !important;
      background: var(--navy) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: var(--radius) !important;
      padding: 10px 22px !important;
      cursor: pointer !important;
    }

    .clc-feedback-submit:hover { background: var(--navy-light) !important; }
    .clc-feedback-submit:disabled { opacity: 0.6 !important; cursor: default !important; }

    .clc-feedback-result {
      margin-top: 4px !important;
      padding: 14px 16px !important;
      border-radius: var(--radius) !important;
      font-size: 0.88rem !important;
      background: #E8F6ED !important;
      color: #1E7A3D !important;
      border: 1px solid #BEE6CB !important;
    }

    /* ============================================================
       LISTS
       ============================================================ */
    .markdown-section ul,
    .markdown-section ol {
      padding-left: 22px !important;
      margin-bottom: 14px !important;
    }

    .markdown-section li {
      font-size: 0.945rem !important;
      line-height: 1.65 !important;
      margin-bottom: 6px !important;
    }

    /* ============================================================
       CODE
       ============================================================ */
    .markdown-section code {
      font-size: 0.82rem !important;
      background: var(--bg) !important;
      color: var(--navy) !important;
      padding: 2px 7px !important;
      border-radius: 4px !important;
      border: 1px solid var(--border) !important;
      font-family: 'Courier New', monospace !important;
    }

    .markdown-section pre {
      background: var(--navy) !important;
      border-radius: var(--radius-lg) !important;
      padding: 20px 24px !important;
      margin: 16px 0 !important;
    }

    .markdown-section pre code {
      background: none !important;
      color: rgba(255,255,255,0.82) !important;
      border: none !important;
    }

    /* ============================================================
       PAGINATION
       ============================================================ */
    .pagination-item a {
      font-family: var(--font-ui) !important;
      font-weight: 600 !important;
      font-size: 0.85rem !important;
      background: var(--navy) !important;
      color: #FFFFFF !important;
      border: none !important;
      border-radius: var(--radius) !important;
      padding: 10px 20px !important;
      text-decoration: none !important;
    }

    .pagination-item a:hover {
      background: var(--navy-light) !important;
      color: #FFFFFF !important;
      border: none !important;
    }

    /* ============================================================
       NPROGRESS (page load bar)
       ============================================================ */
    #nprogress .bar {
      background: var(--orange) !important;
      height: 3px !important;
    }

    /* ============================================================
       READING PROGRESS BAR
       ============================================================ */
    #reading-progress {
      position: fixed;
      top: 102px;
      left: 0;
      width: 0%;
      height: 3px;
      background: linear-gradient(90deg, var(--orange), #F9A84D);
      z-index: 200;
      transition: width 0.1s linear;
      border-radius: 0 2px 2px 0;
    }

    /* ============================================================
       BACK TO TOP BUTTON
       ============================================================ */
    #back-to-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      background: var(--navy);
      color: #FFFFFF;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(13,27,62,0.25);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s, transform 0.25s, background 0.15s;
      z-index: 150;
      pointer-events: none;
    }

    #back-to-top.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    #back-to-top:hover {
      background: var(--navy-light);
    }

    /* ============================================================
       MODULE NAVBAR — lesson links context
       ============================================================ */

    /* Module label (the **Module 2** bold item) */
    .app-nav li > strong {
      font-family: var(--font-ui);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--orange) !important;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 0 8px;
      pointer-events: none;
    }

    /* Back to modules link */
    .app-nav a[href="/"],
    .app-nav a[href="#/"] {
      color: rgba(255,255,255,0.5) !important;
      font-size: 0.78rem !important;
      border-right: 1px solid rgba(255,255,255,0.12) !important;
      border-radius: 0 !important;
      padding-right: 16px !important;
      margin-right: 8px !important;
    }

    .app-nav a[href="/"]:hover,
    .app-nav a[href="#/"]:hover {
      color: rgba(255,255,255,0.85) !important;
      background: none !important;
    }

    /* Scrollable nav on module pages */
    .app-nav ul {
      overflow-x: auto !important;
      flex-wrap: nowrap !important;
      scrollbar-width: none !important;
    }

    .app-nav ul::-webkit-scrollbar { display: none; }

    /* ============================================================
       LESSON ANCHOR HIGHLIGHT
       — flash orange when jumping to a section
       ============================================================ */
    .markdown-section h1,
    .markdown-section h2,
    .markdown-section h3,
    .markdown-section h4 {
      scroll-margin-top: 112px !important;
    }

    .markdown-section h2:target,
    .markdown-section h3:target {
      animation: anchorFlash 1s ease;
    }

    @keyframes anchorFlash {
      0%   { background: rgba(244,123,32,0.15); }
      100% { background: transparent; }
    }



  </style>
</head>
<body>
<div id="app"></div>
  <div id="reading-progress"></div>
  <button id="back-to-top" title="Back to top">↑</button>

  <!-- Static stub form so Netlify's build-time bot registers the
       "quiz-results" form schema. Never shown or filled in by hand —
       assets/quiz.js submits real results to this same form name via
       a background fetch() POST to "/". Keep every field name here in
       sync with the fields quiz.js actually sends. -->
  <form name="quiz-results" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="quiz-results">
    <input type="text" name="bot-field">
    <input type="text" name="name">
    <input type="text" name="module">
    <input type="text" name="score">
    <input type="text" name="percent">
    <input type="text" name="passed">
    <input type="text" name="timestamp">
  </form>

  <!-- Static stub form so Netlify's build-time bot registers the
       "course-feedback" form schema. Never shown or filled in by hand —
       assets/feedback.js submits real feedback to this same form name
       via a background fetch() POST to "/". This is the single form
       used for both SME corrections and general learner feedback,
       distinguished by the "type" field. Keep field names in sync with
       what feedback.js actually sends. -->
  <form name="course-feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="course-feedback">
    <input type="text" name="bot-field">
    <input type="text" name="type">
    <input type="text" name="page">
    <input type="text" name="name">
    <textarea name="comment"></textarea>
    <input type="text" name="timestamp">
  </form>

  <script>
    window.$docsify = {
      name: 'Commercial Lighting Essentials',
      repo: '',
      loadNavbar: true,
      loadSidebar: false,
      subMaxLevel: 0,
      mergeNavbar: true,
      auto2top: true,
      homepage: 'README.md',
      search: {
        // Explicit page list — required because loadSidebar is false.
        // Docsify's search plugin defaults to "auto" path discovery,
        // which crawls the sidebar nav tree (.sidebar-nav a) to find
        // pages to index. With no sidebar tree in this site (nav lives
        // in the top navbar instead), "auto" silently falls back to
        // indexing ONLY the homepage — every other page (including all
        // module content) was invisible to search. Add new pages here
        // when they're added to the site.
        paths: ['/', '/module-1/', '/module-2/', '/module-2b/', '/module-3/', '/glossary/'],
        placeholder: 'Search course content...',
        noData: 'No results.',
        depth: 4,
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
        crossChapterText: true,
      },
      plugins: [
        /* Style ⚠️ blockquotes red */
        function(hook) {
          hook.doneEach(function() {
            document.querySelectorAll('.markdown-section blockquote p').forEach(function(p) {
              if (p.textContent.trim().startsWith('⚠️')) {
                var bq = p.closest('blockquote');
                bq.style.borderLeftColor = '#C0392B';
                bq.style.background = '#FDF2F2';
              }
            });
          });
        },
        /* Force card button text white after render */
        function(hook) {
          hook.doneEach(function() {
            document.querySelectorAll('.module-card-btn').forEach(function(btn) {
              btn.style.setProperty('color', '#FFFFFF', 'important');
              btn.style.setProperty('border-bottom', 'none', 'important');
              btn.style.setProperty('text-decoration', 'none', 'important');
            });
          });
        },
        /* Table interactivity: click-to-sort on comparison tables,
           search + sticky header on any table under a "Glossary" heading */
        function(hook) {
          hook.doneEach(function() {
            var container = document.querySelector('.markdown-section');
            if (!container) return;

            function precedingHeadingText(table) {
              var all = Array.prototype.slice.call(container.querySelectorAll('h1,h2,h3,h4,table'));
              var idx = all.indexOf(table);
              for (var i = idx - 1; i >= 0; i--) {
                if (/^H[1-4]$/.test(all[i].tagName)) return all[i].textContent || '';
              }
              return '';
            }

            function enhanceSortable(table) {
              table.classList.add('clc-sortable');
              var ths = Array.prototype.slice.call(table.querySelectorAll('thead th'));
              var state = { idx: null, dir: 1 };
              ths.forEach(function(th, idx) {
                var caret = document.createElement('span');
                caret.className = 'clc-caret';
                caret.textContent = '▲';
                th.appendChild(caret);
                th.addEventListener('click', function() {
                  var dir = (state.idx === idx) ? -state.dir : 1;
                  state = { idx: idx, dir: dir };
                  ths.forEach(function(h, i) {
                    h.classList.toggle('clc-sorted', i === idx);
                    var c = h.querySelector('.clc-caret');
                    c.textContent = (i === idx && dir === -1) ? '▼' : '▲';
                  });
                  var tbody = table.querySelector('tbody');
                  var rows = Array.prototype.slice.call(tbody.querySelectorAll('tr'));
                  rows.sort(function(a, b) {
                    var ta = (a.children[idx] ? a.children[idx].textContent : '').trim();
                    var tb = (b.children[idx] ? b.children[idx].textContent : '').trim();
                    var na = parseFloat(ta.replace(/[^0-9.\-]/g, ''));
                    var nb = parseFloat(tb.replace(/[^0-9.\-]/g, ''));
                    var numeric = !isNaN(na) && !isNaN(nb) && /\d/.test(ta) && /\d/.test(tb);
                    if (numeric) return (na - nb) * dir;
                    return ta.toLowerCase().localeCompare(tb.toLowerCase()) * dir;
                  });
                  rows.forEach(function(r) { tbody.appendChild(r); });
                });
              });
            }

            function enhanceGlossary(table) {
              var wrap = document.createElement('div');
              wrap.className = 'clc-glossary-wrap';
              var search = document.createElement('input');
              search.type = 'text';
              search.className = 'clc-glossary-search';
              search.placeholder = 'Search terms or definitions…';
              var scroll = document.createElement('div');
              scroll.className = 'clc-glossary-scroll';
              var empty = document.createElement('p');
              empty.className = 'clc-glossary-empty';
              empty.textContent = 'No terms match that search.';
              empty.hidden = true;

              table.parentNode.insertBefore(wrap, table);
              wrap.appendChild(search);
              wrap.appendChild(scroll);
              scroll.appendChild(table);
              wrap.appendChild(empty);

              search.addEventListener('input', function() {
                var q = search.value.trim().toLowerCase();
                var rows = Array.prototype.slice.call(table.querySelectorAll('tbody tr'));
                var visible = 0;
                rows.forEach(function(r) {
                  var match = r.textContent.toLowerCase().indexOf(q) !== -1;
                  r.classList.toggle('clc-hidden', !match);
                  if (match) visible++;
                });
                empty.hidden = visible !== 0;
              });
            }

            container.querySelectorAll('table').forEach(function(table) {
              if (table.dataset.clcEnhanced) return;
              table.dataset.clcEnhanced = '1';

              var heading = precedingHeadingText(table).toLowerCase();
              var cols = table.querySelectorAll('thead th').length;
              var rowCount = table.querySelectorAll('tbody tr').length;

              if (heading.indexOf('glossary') !== -1 && cols === 2 && rowCount > 6) {
                enhanceGlossary(table);
              } else if (cols >= 2 && rowCount > 1) {
                enhanceSortable(table);
              }
            });
          });
        },
        /* Module quizzes: render any <div class="clc-quiz" data-quiz-id="…">
           placeholder using assets/quiz.js (loaded below) */
        function(hook) {
          hook.doneEach(function() {
            if (typeof window.clcRenderQuiz !== 'function') return;
            document.querySelectorAll('.clc-quiz[data-quiz-id]').forEach(function(el) {
              window.clcRenderQuiz(el, el.dataset.quizId);
            });
          });
        },
        /* Page feedback widget: auto-appended to the bottom of every
           page (no placeholder needed in the markdown) using
           assets/feedback.js (loaded below) */
        function(hook) {
          hook.doneEach(function() {
            if (typeof window.clcRenderFeedback !== 'function') return;
            var container = document.querySelector('.markdown-section');
            if (!container) return;
            var pageId = (window.location.hash || '#/').replace(/^#/, '').split('?')[0] || '/';
            window.clcRenderFeedback(container, pageId);
          });
        }
      ]
    }
  </script>

  <script src="assets/quiz.js"></script>
  <script src="assets/feedback.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>

  <script>
    // Reading progress bar + back to top
    var progressBar = document.getElementById('reading-progress');
    var backToTop   = document.getElementById('back-to-top');

    window.addEventListener('scroll', function() {
      var scrollTop    = window.scrollY;
      var docHeight    = document.documentElement.scrollHeight - window.innerHeight;
      var progress     = docHeight > 0 ? (scrollTop / docHeight) * 100 : 0;
      progressBar.style.width = progress + '%';

      if (scrollTop > 400) {
        backToTop.classList.add('visible');
      } else {
        backToTop.classList.remove('visible');
      }
    });

    backToTop.addEventListener('click', function() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>

</body>
</html>
